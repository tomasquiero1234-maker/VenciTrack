<style>
:root { --bg: #f4f5f7; --surface: #ffffff; --ink: #14181d; --ink-2: #48505b; --muted: #737c87; --rule: #dfe3e8; --accent: #173f73; --on-accent: #ffffff; --error: #b42318; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #101214; --surface: #181b1f; --ink: #eef0f3; --ink-2: #bcc3cc; --muted: #8b939d; --rule: #2b3037; --accent: #8fb8ee; --on-accent: #0b1220; --error: #f97066; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; display: grid; place-items: center; padding-inline: 16px; }
form { width: min(380px, 100%); background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: 28px 24px; display: grid; gap: 14px; }
.eyebrow { font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1 { margin: 0; font-size: 24px; letter-spacing: -0.01em; }
p { margin: 0; color: var(--ink-2); font-size: 14px; line-height: 1.5; }
label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
input { font: inherit; font-size: 15px; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--bg); color: var(--ink); width: 100%; }
button { font: inherit; font-weight: 600; padding: 10px 14px; border: 0; border-radius: 8px; background: var(--accent); color: var(--on-accent); cursor: pointer; }
button[disabled] { opacity: 0.6; cursor: progress; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.err { color: var(--error); font-size: 13px; min-height: 1.2em; }
.meta { font-size: 12px; color: var(--muted); }
</style>

<script>
(function () {
  const P = JSON.parse(document.getElementById("mv-cifrado").textContent);
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  async function abrir(clave) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(clave), "PBKDF2", false, ["deriveKey"]);
    const llave = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(P.salt), iterations: P.iter, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const plano = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.iv) }, llave, b64(P.ct));
    return new TextDecoder().decode(plano);
  }
  document.getElementById("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("btn"), err = document.getElementById("err");
    btn.disabled = true; btn.textContent = "Abriendo…"; err.textContent = "";
    try {
      const html = await abrir(document.getElementById("clave").value);
      document.open(); document.write(html); document.close();
    } catch (ex) {
      err.textContent = window.crypto && crypto.subtle ? "Contraseña incorrecta. Revisa mayúsculas y vuelve a intentar." : "Este navegador no permite abrir la página. Usa Chrome, Edge o Safari actualizados.";
      btn.disabled = false; btn.textContent = "Abrir";
    }
  });
})();
</script>
